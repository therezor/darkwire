# The Rust workspace. One crate per former TypeScript package, same names, same
# layering: a crate that does not list another in `[dependencies]` cannot `use`
# it, which is the mechanical enforcement pnpm's isolated `node_modules` gave the
# TypeScript graph. See docs/architecture.md#layering.
#
# One version for the whole workspace, read by every crate through
# `env!("CARGO_PKG_VERSION")`. It must equal the `version` in the root
# package.json; a test in the `ghostai` crate asserts that, which replaces the
# old hand-edited VERSION / SERVER_VERSION literals.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/therezor/GhostAI"
homepage = "https://github.com/therezor/GhostAI"
publish = false

# One version per dependency for the whole workspace. Pinned exact on purpose,
# like a lockfile: Cargo.lock already fixes what builds, and an exact requirement
# here makes a bump a visible diff rather than something `cargo update` does
# quietly. Bump them deliberately, in their own commit.
[workspace.dependencies]
# workspace crates
ghostai-protocol = { path = "crates/protocol" }
ghostai-i18n = { path = "crates/i18n" }
ghostai-tui = { path = "crates/tui" }
ghostai-core = { path = "crates/core" }
ghostai-security = { path = "crates/security" }
ghostai-providers = { path = "crates/providers" }
ghostai-tools = { path = "crates/tools" }
ghostai-mcp = { path = "crates/mcp" }
ghostai-agent = { path = "crates/agent" }
ghostai-channels = { path = "crates/channels" }
ghostai-extension-host = { path = "crates/extension-host" }
ghostai-runtime = { path = "crates/runtime" }
ghostai-sandbox = { path = "crates/sandbox" }
ghostai-server = { path = "crates/server" }

# async
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
futures = "=0.3.34"

# serialisation: the wire contract
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "=0.10.0"
schemars = { version = "=1.2.2", features = ["indexmap2"] }
serde_with = "=3.23.0"
garde = { version = "=0.23.0", features = ["derive", "regex"] }
indexmap = { version = "=2.14.2", features = ["serde"] }

# errors and logging
thiserror = "=2.0.20"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

# storage
rusqlite = { version = "=0.40.2", features = ["bundled"] }
parking_lot = "=0.12.5"

# network
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
hickory-resolver = "=0.26.3"
axum = { version = "=0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["fs"] }
rust-embed = "=8.12.0"

# crypto
aes-gcm = "=0.11.1"
sha2 = "=0.11.0"
hmac = "=0.13.0"
argon2 = "=0.6.0"
subtle = "=2.6.1"
rand = "=0.10.2"
base64 = "=0.23.1"
uuid = { version = "=1.26.1", features = ["v7", "serde"] }

# time and text
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
# The host's IANA zone name, which chrono does not expose. Already in the lock
# file as one of chrono's own dependencies; named here because the prompt's
# clock line prints the zone and an agent has to say which one it read.
iana-time-zone = "=0.1.65"
icu_plurals = "=2.3.0"
icu_locale_core = "=2.3.0"
regex = "=1.13.1"
semver = { version = "=1.0.28", features = ["serde"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"

# terminal
clap = { version = "=4.6.6", features = ["derive", "env"] }
owo-colors = "=4.4.0"
crossterm = { version = "=0.29.0", features = ["event-stream"] }

# protocol clients and processes
rmcp = { version = "=3.3.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "client-side-sse"] }
oauth2 = { version = "=5.0.0", default-features = false }
jsonschema = { version = "=0.56.0", default-features = false }
nix = { version = "=0.31.3", features = ["signal", "fs", "process"] }
walkdir = "=2.5.0"
lru = "=0.18.4"
dashmap = "=6.2.1"

# dev
proptest = "=1.11.0"
insta = { version = "=1.48.0", features = ["json"] }
tempfile = "=3.27.0"
wiremock = "=0.6.5"

# added by the core port: dotted paths on a serde error, and pino's `hostname`
serde_path_to_error = "=0.1.20"
gethostname = "=1.1.0"

# added by the server port: a WebSocket client for the one test that completes a
# handshake (already in the lock file as axum's own dependency)
tokio-tungstenite = "=0.29.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# `all` is denied and `pedantic` warns locally; CI passes `-D warnings`, which
# promotes every pedantic finding to an error there. A new `#[allow]` needs a
# one-line comment saying why. The three allowed below are pedantic lints that
# fight this repo's conventions rather than catch bugs.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
