# The Rust workspace. One crate per former TypeScript package, same names, same
# layering: a crate that does not list another in `[dependencies]` cannot `use`
# it, which is the mechanical enforcement pnpm's isolated `node_modules` gave the
# TypeScript graph. See docs/architecture.md#layering.
#
# One version for the whole workspace, read by every crate through
# `env!("CARGO_PKG_VERSION")`. It must equal the `version` in the root
# package.json; a test in the `darkwire` crate asserts that, which replaces the
# old hand-edited VERSION / SERVER_VERSION literals.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/therezor/darkwire"
homepage = "https://github.com/therezor/darkwire"
publish = false

# One version per dependency for the whole workspace. Pinned exact on purpose,
# like a lockfile: Cargo.lock already fixes what builds, and an exact requirement
# here makes a bump a visible diff rather than something `cargo update` does
# quietly. Bump them deliberately, in their own commit.
[workspace.dependencies]
# workspace crates
darkwire-protocol = { path = "crates/protocol" }
darkwire-i18n = { path = "crates/i18n" }
darkwire-tui = { path = "crates/tui" }
darkwire-core = { path = "crates/core" }
darkwire-security = { path = "crates/security" }
darkwire-providers = { path = "crates/providers" }
darkwire-tools = { path = "crates/tools" }
darkwire-mcp = { path = "crates/mcp" }
darkwire-agent = { path = "crates/agent" }
darkwire-channels = { path = "crates/channels" }
darkwire-extension-host = { path = "crates/extension-host" }
darkwire-runtime = { path = "crates/runtime" }
darkwire-environment = { path = "crates/environment" }
darkwire-server = { path = "crates/server" }

# async
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
futures = "=0.3.34"

# serialisation: the wire contract
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "=0.10.0"
schemars = { version = "=1.2.2", features = ["indexmap2"] }
serde_with = "=3.23.0"
garde = { version = "=0.23.0", features = ["derive", "regex"] }
indexmap = { version = "=2.14.2", features = ["serde"] }

# errors and logging
thiserror = "=2.0.20"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

# storage
rusqlite = { version = "=0.40.2", features = ["bundled"] }
parking_lot = "=0.12.5"

# network
# `http2` because a Chrome user agent arriving over HTTP/1.1 is a contradiction
# any bot wall reads in one line, and the decompression features because Chrome
# sends `accept-encoding` and a client that cannot decode what it asked for gets
# bytes it cannot read. `zstd` is deliberately absent: `zstd-sys` builds C from
# source, and one missing encoding is a smaller cost than a C toolchain.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "gzip", "deflate", "brotli"] }
hickory-resolver = "=0.26.3"
axum = { version = "=0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["fs"] }
rust-embed = "=8.12.0"

# crypto
aes-gcm = "=0.11.1"
sha2 = "=0.11.0"
hmac = "=0.13.0"
argon2 = "=0.6.0"
subtle = "=2.6.1"
rand = "=0.10.2"
base64 = "=0.23.1"
uuid = { version = "=1.26.1", features = ["v7", "serde"] }

# the web tools: a page into the least markdown that still answers a question
# Already in the tree under dom_smoothie. Named directly because the search
# backends select against a SERP, and a selector engine is the difference
# between a parser that survives a markup change and one that does not.
dom_query = "=0.28.0"
dom_smoothie = "=0.18.2"
htmd = "=0.5.5"
# Charset decoding. `GuardedResponse::text` is lossy UTF-8, so a Shift-JIS or
# GBK page arrives as mojibake and the model reports the site as broken.
encoding_rs = "=0.8.41"

# time and text
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
# The host's IANA zone name, which chrono does not expose. Already in the lock
# file as one of chrono's own dependencies; named here because the prompt's
# clock line prints the zone and an agent has to say which one it read.
iana-time-zone = "=0.1.65"
icu_plurals = "=2.3.0"
icu_locale_core = "=2.3.0"
regex = "=1.13.1"
semver = { version = "=1.0.28", features = ["serde"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"

# terminal
clap = { version = "=4.6.6", features = ["derive", "env"] }
owo-colors = "=4.4.0"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
ratatui = { version = "=0.30.2", features = ["scrolling-regions", "unstable-backend-writer"] }

# protocol clients and processes
rmcp = { version = "=3.3.0", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "client-side-sse"] }
oauth2 = { version = "=5.0.0", default-features = false }
jsonschema = { version = "=0.56.0", default-features = false }
nix = { version = "=0.31.3", features = ["signal", "fs", "process"] }
walkdir = "=2.5.0"
# ripgrep as a library, for the `grep` and `find` tools. In-process rather than
# a child `rg`, because the file tools must hold inside the workspace jail and
# must work in a container image that ships no search binary.
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"
ignore = "=0.4.33"
globset = "=0.4.20"
# Already under the crates above; named here because `read` counts newlines.
memchr = "=2.8.3"
lru = "=0.18.4"
dashmap = "=6.2.1"

# dev
proptest = "=1.11.0"
# A terminal emulator in a test: the tui crate asserts what a real terminal
# would show after the escape sequences it writes, not what it meant to write.
vt100 = "=0.16.2"
insta = { version = "=1.48.0", features = ["json"] }
tempfile = "=3.27.0"
wiremock = "=0.6.5"

# added by the core port: dotted paths on a serde error, and pino's `hostname`
serde_path_to_error = "=0.1.20"
gethostname = "=1.1.0"

# added by the server port: a WebSocket client for the one test that completes a
# handshake (already in the lock file as axum's own dependency)
tokio-tungstenite = "=0.29.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# `all` is denied and `pedantic` warns locally; CI passes `-D warnings`, which
# promotes every pedantic finding to an error there. A new `#[allow]` needs a
# one-line comment saying why. The three allowed below are pedantic lints that
# fight this repo's conventions rather than catch bugs.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Line tables only, for the workspace and for every dependency. A panic
# still names the file and line, which is what a backtrace is read for; the
# full DWARF that a step-through debugger wants was most of a multi-gigabyte
# `target/` and a good share of every rebuild. Set `CARGO_PROFILE_DEV_DEBUG=2`
# for the one session that needs to step through.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
