<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  width="24"
  height="24"
  fill="none"
  stroke="#009100"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!--
    lucide's `webhook`, with the colour and the stroke attributes written out. A
    browser tab has no cascade to inherit a colour from and no component to get
    lucide's defaults from, so this file is the one place in the package a raw
    colour is correct rather than a mistake. (The token gates scan `index.html`
    and `src/**`; this is neither, and `favicon.test.ts` holds the three paths
    below to the ones lucide actually renders.)

    #009100 is the brand hue at a lightness the accent itself does not use, a
    little under the token's `oklch(0.628 0.213 142.5)`. That divergence is
    deliberate and it is the whole point of this comment. The accent is the
    terminal green `#00A600`, chosen to sit on surfaces this app controls, and
    it measures 3.3:1 against white. A tab strip is the one surface we do not
    control. It is near-black in one OS theme and white in the other, so the
    mark is pulled down a step, where it holds both ways (4.2:1 on white, 4.9:1
    on near-black).

    One colour rather than a `prefers-color-scheme` swap: a favicon that changes
    colour with the OS theme is one users stop recognising.
  -->
  <path
    d="M18 16.98h-5.99c-1.1 0-1.95.94-2.48 1.9A4 4 0 0 1 2 17c.01-.7.2-1.4.57-2"
  />
  <path d="m6 17 3.13-5.78c.53-.97.1-2.18-.5-3.1a4 4 0 1 1 6.89-4.06" />
  <path d="m12 6 3.13 5.73C15.66 12.7 16.9 13 18 13a4 4 0 0 1 0 8" />
</svg>
