[package]
name = "darkwire-security"
description = "Every path, host, process, container and credential guard, in one place"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[features]
# Test doubles other crates' tests reach through `features = ["testkit"]`;
# excluded from coverage.
testkit = []

[dependencies]
darkwire-core.workspace = true
darkwire-protocol.workspace = true
aes-gcm.workspace = true
base64.workspace = true
cap-std.workspace = true
futures.workspace = true
garde.workspace = true
hickory-resolver.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
walkdir.workspace = true

[dev-dependencies]
# The crate's own test doubles, and core's clock, reach the tests through the
# feature the gate does not otherwise turn on.
darkwire-security = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
proptest.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[[test]]
name = "security"
path = "tests/main.rs"
