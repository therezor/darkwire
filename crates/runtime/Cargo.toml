[package]
name = "darkwire-runtime"
description = "The composition root: config in, a running agent out"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
darkwire-agent.workspace = true
darkwire-core.workspace = true
darkwire-extension-host.workspace = true
darkwire-mcp.workspace = true
darkwire-protocol.workspace = true
darkwire-providers.workspace = true
darkwire-security.workspace = true
darkwire-tools.workspace = true
darkwire-environment.workspace = true
futures.workspace = true
gethostname.workspace = true
indexmap.workspace = true
# `kill(pid, None)` is the orphan sweep's liveness probe; nothing else here
# signals a process.
nix.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Dotted paths on the re-parse a settings patch has to survive.
serde_path_to_error.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The composition root is the natural consumer of every layer's test doubles:
# nothing below it has to spawn a subprocess, open a socket or touch a keychain
# for these tests to be about wiring.
darkwire-agent = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
darkwire-extension-host = { workspace = true, features = ["testkit"] }
darkwire-mcp = { workspace = true, features = ["testkit"] }
darkwire-providers = { workspace = true, features = ["testkit"] }
darkwire-security = { workspace = true, features = ["testkit"] }
darkwire-tools = { workspace = true, features = ["testkit"] }
# The end-to-end channel test, deferred out of `crates/channels` because that
# crate must not depend on the agent: a message through a real loop, store and
# channel contract, proving a channel turn is the turn a browser gets.
darkwire-channels = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
