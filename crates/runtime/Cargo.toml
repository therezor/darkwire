[package]
name = "ghostai-runtime"
description = "The composition root: config in, a running agent out"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ghostai-agent.workspace = true
ghostai-core.workspace = true
ghostai-extension-host.workspace = true
ghostai-mcp.workspace = true
ghostai-protocol.workspace = true
ghostai-providers.workspace = true
ghostai-security.workspace = true
ghostai-tools.workspace = true
futures.workspace = true
gethostname.workspace = true
indexmap.workspace = true
# `kill(pid, None)` is the orphan sweep's liveness probe; nothing else here
# signals a process.
nix.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Dotted paths on the re-parse a settings patch has to survive.
serde_path_to_error.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The composition root is the natural consumer of every layer's test doubles:
# nothing below it has to spawn a subprocess, open a socket or touch a keychain
# for these tests to be about wiring.
ghostai-agent = { workspace = true, features = ["testkit"] }
ghostai-core = { workspace = true, features = ["testkit"] }
ghostai-extension-host = { workspace = true, features = ["testkit"] }
ghostai-mcp = { workspace = true, features = ["testkit"] }
ghostai-providers = { workspace = true, features = ["testkit"] }
ghostai-security = { workspace = true, features = ["testkit"] }
ghostai-tools = { workspace = true, features = ["testkit"] }
# The end-to-end channel test, deferred out of `crates/channels` because that
# crate must not depend on the agent: a message through a real loop, store and
# channel contract, proving a channel turn is the turn a browser gets.
ghostai-channels = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
