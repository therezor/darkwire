[package]
name = "ghostai-environment"
description = "Execution environment service and client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ghostai-core.workspace = true
ghostai-protocol.workspace = true
ghostai-security.workspace = true
ghostai-tools.workspace = true
gethostname.workspace = true
indexmap.workspace = true
nix.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The pool suite runs no daemon: the engine is a double, the clock is manual and
# the only real thing on disk is the policy directory.
ghostai-core = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
parking_lot.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "ghostai-environment"
path = "src/main.rs"
