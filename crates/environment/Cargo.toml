[package]
name = "darkwire-environment"
description = "Execution environment service and client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[dependencies]
darkwire-core.workspace = true
darkwire-protocol.workspace = true
darkwire-security.workspace = true
darkwire-tools.workspace = true
gethostname.workspace = true
indexmap.workspace = true
nix.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The pool suite runs no daemon: the engine is a double, the clock is manual and
# the only real thing on disk is the policy directory.
darkwire-core = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
parking_lot.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "darkwire-environment"
path = "src/main.rs"

[[test]]
name = "environment"
path = "tests/main.rs"
