[package]
name = "ghostai-channels"
description = "The Channel contract, ChannelManager, TurnProjection and the Telegram adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The conformance suite and the scripted hub it runs on, reached by an
# implementation outside this repository through `features = ["testkit"]`.
# Excluded from coverage.
testkit = []

[dependencies]
ghostai-core.workspace = true
ghostai-protocol.workspace = true
futures.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The crate's own conformance suite, and core's manual clock, reach the tests
# through the feature the coverage gate does not otherwise turn on.
ghostai-channels = { workspace = true, features = ["testkit"] }
ghostai-core = { workspace = true, features = ["testkit"] }
proptest.workspace = true
tempfile.workspace = true
# `start_paused` for the poll-backoff tests: nothing sleeps for real.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
