[package]
name = "ghostai-extension-host"
description = "Extension discovery, digest approval, and the out-of-process JSON-RPC host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The conformance suite, which `examples/hello-extension` drives through the
# `check` example and an extension in its own repository drives from its own
# tests. Excluded from coverage. Free of any test-framework dependency.
testkit = []

[dependencies]
ghostai-agent.workspace = true
ghostai-channels.workspace = true
ghostai-core.workspace = true
ghostai-protocol.workspace = true
ghostai-providers.workspace = true
ghostai-security.workspace = true
ghostai-tools.workspace = true
ghostai-mcp.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Signalling a process *group*: `kill_on_drop` reaches the child alone, and a
# `node` that spawned a worker would leave it behind.
nix.workspace = true

[[example]]
name = "check"
required-features = ["testkit"]

[dev-dependencies]
ghostai-extension-host = { workspace = true, features = ["testkit"] }
ghostai-core = { workspace = true, features = ["testkit"] }
ghostai-security = { workspace = true, features = ["testkit"] }
ghostai-tools = { workspace = true, features = ["testkit"] }
# `start_paused` for the framing tests, which speak over an in-memory pipe and
# must never wait on a real timer.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
# The conformance suite kills a child out from under the host, which is the one
# thing it cannot ask the host to do for it.
nix.workspace = true
