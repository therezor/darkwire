[package]
name = "darkwire-server"
description = "The HTTP server: REST, the WebSocket hub, auth, the scheduler, static UI, OpenAPI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[features]
default = ["embed-ui"]
# The built SPA compiled into the binary. Off in a headless build; see
# `DARKWIRE_HEADLESS_BUILD` in build.rs, which is the escape CI uses when
# `packages/web/dist` has not been built. Without one of the two escapes a
# missing bundle fails the build.
embed-ui = ["dep:rust-embed"]
# Test doubles the e2e harness and `darkwire-runtime` reach through
# `features = ["testkit"]`; excluded from coverage. It stands a whole server up
# over a scripted model, so it needs the doubles of the crates below it too.
testkit = [
  "dep:tempfile",
  "darkwire-agent/testkit",
  "darkwire-core/testkit",
  "darkwire-providers/testkit",
]
# Routes and seams only the end-to-end suite uses. Both this feature and
# `DARKWIRE_TEST_HOOKS=1` are required at run time, so a shipped binary that was
# built without the feature cannot be talked into them.
test-hooks = []

[dependencies]
darkwire-agent.workspace = true
darkwire-core.workspace = true
darkwire-protocol.workspace = true
darkwire-providers.workspace = true
darkwire-security.workspace = true
darkwire-tools.workspace = true
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
futures.workspace = true
garde.workspace = true
# The machine's own name is one of the `Host` values it always answers to.
gethostname.workspace = true
hmac.workspace = true
indexmap.workspace = true
lru.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
rust-embed = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# Dotted paths on a deserialisation failure, which is what a 422's `details`
# map is keyed by.
serde_path_to_error.workspace = true
sha2.workspace = true
subtle.workspace = true
# The testkit's temporary home; optional so a production build never links it.
tempfile = { workspace = true, optional = true }
tokio.workspace = true
# `io` on top of the workspace line's `rt`: the signed-media body is a
# `ReaderStream` over the open file rather than the whole file in memory.
tokio-util = { workspace = true, features = ["io"] }
# `util` for `ServiceExt::oneshot`, which is how a test drives the router with
# no listener at all.
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
# The crate's own doubles and hook routes, plus the doubles of the crates below
# it, reach the tests through features the gate does not otherwise turn on.
darkwire-server = { workspace = true, features = ["testkit", "test-hooks"] }
darkwire-agent = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
darkwire-providers = { workspace = true, features = ["testkit"] }
darkwire-security = { workspace = true, features = ["testkit"] }
darkwire-tools = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
# Paused time, so a test can move the login-expiry timer by hand.
tokio = { workspace = true, features = ["test-util"] }
# A real client for the one test that has to complete a WebSocket handshake;
# everything else goes through `tower::ServiceExt::oneshot` with no listener.
tokio-tungstenite.workspace = true

[[test]]
name = "server"
path = "tests/main.rs"
