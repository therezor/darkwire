[package]
name = "ghostai-agent"
description = "The agent loop, dispatch, prompt assembly, steering, subagents, context measurement"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test doubles other crates' tests reach through `features = ["testkit"]`;
# excluded from coverage.
testkit = []

[dependencies]
ghostai-core.workspace = true
ghostai-protocol.workspace = true
ghostai-providers.workspace = true
ghostai-security.workspace = true
ghostai-tools.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures.workspace = true
iana-time-zone.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The crate's own test doubles, and the testkits of the layers below, reach the
# tests through features the coverage gate does not otherwise turn on.
ghostai-agent = { workspace = true, features = ["testkit"] }
ghostai-core = { workspace = true, features = ["testkit"] }
ghostai-providers = { workspace = true, features = ["testkit"] }
ghostai-tools = { workspace = true, features = ["testkit"] }
# `start_paused` for the heartbeat, wall-cap and delegation-cap tests: nothing
# sleeps for real, and the harness's clock reads the same timer.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
