[package]
name = "darkwire-i18n"
description = "Mirror of @darkwire/i18n: i18next-compatible lookup over the shared locale bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
icu_locale_core = { workspace = true }
icu_plurals = { workspace = true }
serde_json = { workspace = true }

# `build.rs` reads the same bundle `include_str!` embeds, to write the key
# constants. One parser for both sides, so they cannot disagree about a key.
[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]

[[test]]
name = "i18n"
path = "tests/main.rs"
