[package]
name = "darkwire-mcp"
description = "The MCP client: connection lifecycle, OAuth, and the bridge from a remote tool onto Tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[features]
# The fake server and its descriptors, which `darkwire-runtime`'s tests drive
# too; excluded from coverage. Free of any test-framework dependency.
testkit = []

[dependencies]
darkwire-core.workspace = true
darkwire-protocol.workspace = true
darkwire-security.workspace = true
darkwire-tools.workspace = true
axum.workspace = true
base64.workspace = true
futures.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
oauth2.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
# Signalling a stdio server's process group: `npx` and `uvx` are launchers,
# and the SDK's kill reaches the launcher alone.
nix.workspace = true

[dev-dependencies]
darkwire-mcp = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
darkwire-security = { workspace = true, features = ["testkit"] }
darkwire-tools = { workspace = true, features = ["testkit"] }
# The in-process server the connector test speaks to over an in-memory pipe.
rmcp = { workspace = true, features = ["server"] }
# `start_paused` for the backoff and timeout tests: nothing sleeps for real.
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
tempfile.workspace = true
# The process-group test checks a grandchild is gone.
nix.workspace = true
wiremock.workspace = true

[[test]]
name = "mcp"
path = "tests/main.rs"
