[package]
name = "ghostai-mcp"
description = "The MCP client: connection lifecycle, OAuth, and the bridge from a remote tool onto Tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The fake server and its descriptors, which `ghostai-runtime`'s tests drive
# too; excluded from coverage. Free of any test-framework dependency.
testkit = []

[dependencies]
ghostai-core.workspace = true
ghostai-protocol.workspace = true
ghostai-security.workspace = true
ghostai-tools.workspace = true
axum.workspace = true
base64.workspace = true
futures.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
oauth2.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[dev-dependencies]
ghostai-mcp = { workspace = true, features = ["testkit"] }
ghostai-core = { workspace = true, features = ["testkit"] }
ghostai-security = { workspace = true, features = ["testkit"] }
ghostai-tools = { workspace = true, features = ["testkit"] }
# The in-process server the connector test speaks to over an in-memory pipe.
rmcp = { workspace = true, features = ["server"] }
# `start_paused` for the backoff and timeout tests: nothing sleeps for real.
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
tempfile.workspace = true
wiremock.workspace = true
