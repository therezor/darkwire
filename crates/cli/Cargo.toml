[package]
name = "darkwire"
description = "The darkwire binary: chat, serve, and the install commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# A library beside the binary, and not for reuse: `tests/` is a separate crate
# that cannot reach into `main.rs`, and coverage measures `src/`. So every
# module lives in the library, `main.rs` is the shim that maps a run to an exit
# code, and the integration tests drive the same code the binary does.
[lib]
name = "darkwire"
path = "src/lib.rs"

[[bin]]
name = "darkwire"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Routes and seams only the end-to-end suite uses, passed down to the server.
# `schemars` comes with it rather than unconditionally: the only thing this
# crate derives a JSON Schema for is `e2e_wait`'s argument type, which no
# shipping build contains.
test-hooks = ["darkwire-server/test-hooks", "dep:schemars"]

[dependencies]
darkwire-agent.workspace = true
darkwire-channels.workspace = true
darkwire-core.workspace = true
darkwire-extension-host.workspace = true
darkwire-i18n.workspace = true
darkwire-protocol.workspace = true
darkwire-providers.workspace = true
darkwire-runtime.workspace = true
darkwire-environment.workspace = true
darkwire-security.workspace = true
darkwire-server.workspace = true
darkwire-tools.workspace = true
darkwire-tui.workspace = true
# Only `main.rs` may use it; everything else returns `WireError`.
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
futures.workspace = true
# Definition validation: the schema declares its constraints with `garde`, and a
# document that parsed but violates one is a refusal with a line per issue.
garde.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
ratatui.workspace = true
owo-colors.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# The logger is a `tracing` layer; installing it needs the registry.
tracing-subscriber.workspace = true

[dev-dependencies]
darkwire-agent = { workspace = true, features = ["testkit"] }
darkwire-channels = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
darkwire-providers = { workspace = true, features = ["testkit"] }
darkwire-security = { workspace = true, features = ["testkit"] }
darkwire-server = { workspace = true, features = ["testkit"] }
darkwire-tools = { workspace = true, features = ["testkit"] }
darkwire-tui = { workspace = true, features = ["testkit"] }
# A real client for the tests that drive a bound listener; everything else in
# this crate talks to the server in-process.
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
