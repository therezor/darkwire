[package]
name = "darkwire-providers"
description = "The provider registry, the openai-chat wire, SSE parsing, resilience, token accounting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[features]
# Test doubles other crates' tests reach through `features = ["testkit"]`:
# a scripted provider, a scripted HTTP server and the conformance suite.
# Excluded from coverage.
testkit = []

[dependencies]
darkwire-core.workspace = true
darkwire-protocol.workspace = true
darkwire-security.workspace = true
chrono.workspace = true
futures.workspace = true
indexmap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
# The crate's own test doubles, and the clocks and random sources of the
# crates below it, reach the tests through the feature the gate does not
# otherwise turn on.
darkwire-providers = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
darkwire-security = { workspace = true, features = ["testkit"] }
proptest.workspace = true
# `start_paused` for the backoff tests: nothing sleeps for real.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[[test]]
name = "providers"
path = "tests/main.rs"
