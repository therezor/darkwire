[package]
name = "darkwire-tools"
description = "The Tool trait, the registry, the built-in tools and the local and container runners"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file: see there.
autotests = false

[lints]
workspace = true

[features]
# `TestWorkspace` and the tool conformance suite, which `darkwire-mcp`'s tests
# run over bridged tools too; excluded from coverage. Free of any
# test-framework dependency.
testkit = ["dep:tempfile"]

[dependencies]
darkwire-core.workspace = true
darkwire-protocol.workspace = true
darkwire-security.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
dom_query.workspace = true
dom_smoothie.workspace = true
encoding_rs.workspace = true
futures.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
htmd.workspace = true
ignore.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
lru.workspace = true
memchr.workspace = true
nix.workspace = true
parking_lot.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own test doubles, and the clock and random doubles of the crates
# below, reach the tests through the feature the gate does not otherwise turn on.
darkwire-tools = { workspace = true, features = ["testkit"] }
darkwire-core = { workspace = true, features = ["testkit"] }
darkwire-security = { workspace = true, features = ["testkit"] }
proptest.workspace = true
tempfile.workspace = true
# Paused time for the registry timeout tests.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "tools"
path = "tests/main.rs"
