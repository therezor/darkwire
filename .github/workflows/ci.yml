name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This job runs Rust, despite its name: the hello-extension conformance
      # spec is a TypeScript test that shells out to `cargo run`, because the
      # suite it runs is the host's and only a host can spawn a child and
      # complete a handshake. Without the cache it is a cold workspace build in
      # the middle of `pnpm test`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # A step of its own, not folded into `pnpm lint`. The three rules — no
      # `px` outside `tokens.css`, no raw hex/rgb/oklch outside it, and no
      # `--color-accent` in a text or border position — hold across CSS, TSX
      # class strings and `index.html`, and no single linter reads all three.
      # Named separately so a failure says which gate, on the summary page,
      # without anyone opening the log.
      - name: Design token gates
        run: pnpm --filter @darkwire/web exec tsx src/tokens/run-gates.ts

      - name: Format check
        run: pnpm format:check

      # `install.sh` is the line the README tells people to pipe into a shell,
      # which makes it the one file here that runs on a stranger's machine with
      # no test around it. shellcheck is preinstalled on the runner.
      - name: Install script
        run: shellcheck -s sh install.sh

      # The other half of the translation gate. `pnpm test` runs the source
      # sweep that finds copy which never became a key; this finds keys that
      # were used and never reached the bundle a translator reads. Neither
      # substitutes for the other — see `i18next-parser.base.js`.
      - name: Translations are in step
        run: pnpm i18n:check

      # The wire contract's other half. The Rust crate mirrors every protocol schema
      # and its drift test compares against `packages/protocol/schema/`; this step
      # keeps that directory equal to what the zod schemas emit today, so the Rust
      # test is comparing against the current contract rather than a stale dump.
      - name: Protocol schemas are in step
        run: pnpm protocol:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The Rust workspace. The same shape as `check`: format, lint, supply-chain,
  # tests, then coverage with per-crate bars. `pnpm install` and the web build come
  # first because the binary embeds `packages/web/dist` and the coverage gate is a
  # Node script. `-D warnings` is passed here rather than in `.cargo/config.toml`
  # so a local exploratory build is not blocked by a warning about to be fixed.
  rust:
    runs-on: ubuntu-latest
    # This job never builds the web bundle, so it asks for a headless build and
    # every cargo step below inherits it. `crates/server/build.rs` refuses a
    # build whose `packages/web/dist` is missing — a released binary with no UI
    # is worse than a build that stops — and this is the escape that refusal is
    # written around. It belongs on the job rather than on the steps that
    # happen to compile today, because the next step someone adds will compile
    # too.
    env:
      DARKWIRE_HEADLESS_BUILD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `rust-toolchain.toml` picks the compiler; the action only installs what it
      # names. The cache keys on Cargo.lock.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Advisories, licences, wildcard versions and git sources; the Cargo
      # analogue of pnpm's release-age policy. See deny.toml.
      - name: Supply chain
        run: cargo deny check

      - name: Test
        run: cargo nextest run --workspace --locked

      # One report, then per-crate bars: llvm-cov's own threshold is global and
      # the bars are not. The table lives in scripts/coverage-gate.mjs.
      - name: Coverage gates
        run: |
          cargo llvm-cov nextest --workspace --locked --json --output-path coverage.json
          node scripts/coverage-gate.mjs coverage.json

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage gates
        run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # The suite serves the built SPA through the real server, so the build is
      # a precondition rather than a convenience: the binary embeds
      # `packages/web/dist` at compile time and the harness passes the same
      # directory with `--ui`, so without this the bundle exists in neither
      # place.
      - name: Build
        run: pnpm build

      # The server under test, as a binary rather than as a composition in the
      # test process. `--features test-hooks` is what compiles the five
      # `/api/_test/*` routes, the comparison password hasher, the keychain-free
      # vault and the `e2e_wait` tool; every one of them still refuses until
      # `DARKWIRE_TEST_HOOKS=1` says so, which the harness sets on the child and
      # nothing else does. The release profile because a debug binary spends
      # longer starting than the assertions take.
      - name: Build the server
        run: cargo build --release -p darkwire --features test-hooks

      # Only the browser the suite uses. `--with-deps` installs the shared
      # libraries a headless Chromium needs on a bare runner.
      - name: Install Chromium
        run: pnpm --filter @darkwire/e2e exec playwright install --with-deps chromium

      # Both colour schemes, because the projects are the themes: a component
      # that only works in dark is a failing test here rather than something
      # someone notices in review.
      #
      # The fidelity gate skips itself — it measures against a checkout of the
      # product being replaced, which is not on a CI machine and is not going to
      # be. It runs locally, and `pnpm --filter @darkwire/e2e baseline` is what
      # produces the pictures beside it.
      - name: End-to-end
        run: pnpm --filter @darkwire/e2e test:e2e
        env:
          DARKWIRE_BIN: target/release/darkwire

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: packages/e2e/artifacts/
          retention-days: 7
