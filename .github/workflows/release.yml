name: Release

# A tag, not a branch. `ci.yml` runs on pushes to main and on pull requests, so
# a tag push currently triggers nothing at all — which is why the gate is
# repeated here rather than depended on. Tagging is the whole release ceremony:
# bump the root `version` in both `package.json` and `Cargo.toml`, run
# `node scripts/gen-packages.mjs` to carry the first into every manifest,
# commit, tag, push.
#
# What ships is one binary per platform, attached to the GitHub release.
# Nothing is published to npm: the product is `ghostai`, the web bundle is
# compiled into it, and an install is a download rather than a dependency tree.
on:
  push:
    tags: ['v*']
  # A rehearsal. This matrix is the only place three of the four targets are
  # ever compiled — `ci.yml` is x86_64 Linux throughout — so there has to be a
  # way to run it that does not also publish a release, which cannot be
  # withdrawn from the machines that have it. A manual run builds everything
  # and uploads the tarballs as workflow artifacts; it has no tag, so the
  # release job below cannot fire.
  workflow_dispatch:

permissions:
  # For the GitHub Release and the binaries attached to it.
  contents: write

jobs:
  # The same checks `ci.yml` runs, because a tag can be pushed from a branch
  # that never saw them, and a release that has been downloaded cannot be
  # withdrawn from the machines that have it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before `pnpm test`, not after it. The hello-extension conformance spec
      # is a TypeScript test that shells out to `cargo run` — the suite it runs
      # is the host's, because only a host can spawn a child and complete a
      # handshake — so without the cache restored first, `pnpm test` pays a cold
      # workspace build inside a vitest worker.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Design token gates
        run: pnpm --filter @ghostwire/web exec tsx src/tokens/run-gates.ts

      - name: Format check
        run: pnpm format:check

      - name: Install script
        run: shellcheck -s sh install.sh

      - name: Translations are in step
        run: pnpm i18n:check

      - name: Protocol schemas are in step
        run: pnpm protocol:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Supply chain
        run: cargo deny check

      - name: Rust tests
        run: cargo nextest run --workspace --locked

      # The tag has to name the version that would actually ship, and there are
      # two places the version lives: `Cargo.toml` is what the binary reports
      # through `CARGO_PKG_VERSION`, and `package.json` is what the web bundle
      # and the two remaining TypeScript packages carry. A tag that matches one
      # and not the other ships a binary whose `--version` disagrees with the
      # release it came from.
      - name: The tag matches both manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          cargo_version=$(cargo metadata --format-version 1 --no-deps \
            | node -e 'const m=JSON.parse(require("node:fs").readFileSync(0,"utf8"));
                       const p=m.packages.find((p)=>p.name==="ghostai");
                       console.log(p.version)')
          if [ "$tag" != "$root" ]; then
            echo "Tag $GITHUB_REF_NAME does not match root package.json $root." >&2
            exit 1
          fi
          if [ "$tag" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml $cargo_version." >&2
            exit 1
          fi

  # One binary per platform, built on its own architecture rather than
  # cross-compiled: the vault's keychain path and the sandbox's process
  # handling are platform code, and a cross-linker is one more thing that can
  # be subtly wrong in a way only a user discovers.
  #
  # Windows is deliberately absent. The credential vault shells out to the
  # platform keychain and the container runner signals process groups, both of
  # which are POSIX here; the workspace jail is already platform-independent,
  # so adding Windows later is a port of two modules rather than a rewrite.
  #
  # Every runner is pinned, and the Linux pins are the ones that matter to a
  # reader rather than to us. A binary links the glibc it was built against and
  # refuses to start on anything older: `ubuntu-latest` is 24.04, whose glibc
  # 2.39 excludes Debian 12, Ubuntu 22.04 and RHEL 9 — three of the likelier
  # homes for something self-hosted. 22.04 sets the floor at 2.35 and costs
  # nothing. The macOS pins are named versions rather than `macos-latest` for
  # the ordinary reason, plus one specific one: `macos-13` was the last free
  # Intel image and was retired in December 2025, so `macos-15-intel` is what
  # keeps `x86_64-apple-darwin` a native build instead of a cross-compile.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The binary embeds `packages/web/dist`, so the bundle is a build input
      # rather than a separate artifact. Without this the build fails at
      # compile time, which is the intended failure and one step earlier than
      # the old runtime path resolution gave.
      - name: Build the web bundle
        run: pnpm --filter @ghostwire/web build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin ghostai

      # The tarball is named by platform alone, with no version in it, so that
      # `releases/latest/download/ghostai-<target>.tar.gz` resolves — an install
      # line a reader can copy without first looking up what the current version
      # is. The directory *inside* carries the version, so an extracted copy is
      # still self-describing once it has left the download folder.
      - name: Name the artifact
        id: package
        run: |
          asset="ghostai-${{ matrix.target }}"
          dir="ghostai-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$dir"
          cp target/release/ghostai "dist/$dir/"
          cp README.md LICENSE "dist/$dir/"
          tar -czf "dist/$asset.tar.gz" -C dist "$dir"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # `crates/server/build.rs` refuses a build whose `packages/web/dist` is
      # missing, which is the compile-time half. This is the other half, and it
      # is the one that would have caught the old behaviour: start the binary
      # that is about to be uploaded and ask it for the page a person opens. A
      # build with no bundle answers `/` with an honest JSON 404, so the content
      # type is the whole assertion.
      - name: The binary serves the UI
        shell: bash
        run: |
          home=$(mktemp -d)
          target/release/ghostai serve --home "$home" --host 127.0.0.1 --port 0 \
            --ready-file "$home/ready.json" >"$home/serve.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            [ -s "$home/ready.json" ] && break
            sleep 0.5
          done
          if [ ! -s "$home/ready.json" ]; then
            echo "the server never bound a port" >&2
            cat "$home/serve.log" >&2
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          port=$(node -p "JSON.parse(require('node:fs').readFileSync('$home/ready.json','utf8')).port")
          type=$(curl -sS -o /dev/null -w '%{content_type}' "http://127.0.0.1:$port/")
          kill "$pid" 2>/dev/null || true
          case "$type" in
            text/html*) echo "GET / serves the shell ($type)" ;;
            *)
              echo "GET / answered $type, so this binary has no UI compiled in." >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.asset }}
          path: dist/${{ steps.package.outputs.asset }}.tar.gz
          retention-days: 1

  # Only a tag releases. A manual run has none, so it stops after `build`
  # with the tarballs attached to the workflow run — which is what makes the
  # rehearsal safe rather than merely quiet.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # One checksum file for the whole release. A reader who downloaded one
      # tarball can verify it without knowing what else shipped.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The release page is the one people read, and the generated notes are a
      # list of commit subjects — which for a release whose changelog entry runs
      # to a hundred lines says almost nothing. Take the section the version
      # names, and fail if there is not one: a tag with no changelog entry is a
      # release nobody wrote, and that is worth catching here rather than after
      # it is published.
      - name: Release notes, from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            $0 == heading { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section." >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: notes.md
          # A tag with a pre-release suffix — `v1.2.0-rc.1` — must not become
          # the release `releases/latest/download/...` resolves to, which is the
          # URL every install line in the docs uses.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
