---
schema: ghostai.tool/1
description: Show which files in the workspace have uncommitted changes.
parameters:
  type: object
  properties: {}
  additionalProperties: false
implementation:
  kind: command
  executable: '/usr/bin/git'
  argv:
    - '--no-pager'
    - '--no-optional-locks'
    - '-c'
    - core.fsmonitor=false
    - '-c'
    - safe.directory=/workspace
    - status
    - '--porcelain=v1'
