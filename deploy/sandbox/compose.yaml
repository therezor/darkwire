name: ghostai
services:
  sandbox:
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile
      target: service
    environment:
      GHOSTAI_DATA_DIR: ${GHOSTAI_DATA_DIR:?Set an absolute host data directory}
      GHOSTAI_SANDBOX_CONTAINERS: ${GHOSTAI_SANDBOX_CONTAINERS:-dev}
      GHOSTAI_GATEWAY_IMAGE: ${GHOSTAI_GATEWAY_IMAGE:-}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${GHOSTAI_DATA_DIR}/policies:/policies:ro
      - ${GHOSTAI_DATA_DIR}/sandbox-state:/sandbox-state
      - ${GHOSTAI_DATA_DIR}/workspaces/default:/workspaces/default
      - control:/run/ghostai
    restart: unless-stopped
    stop_grace_period: 20s
  app:
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile
      target: app
    environment:
      GHOSTAI_HOME: /app-state
      GHOSTAI_SANDBOX_SOCKET: /run/ghostai/sandbox.sock
      GHOSTAI_PASSWORD: ${GHOSTAI_PASSWORD:?Set the web login password}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ${GHOSTAI_DATA_DIR}/app-state:/app-state
      # Read-only, and the same directory the service reads. The app resolves
      # approvals for itself rather than being told them, so both have to see
      # the same bytes; neither may write them.
      - ${GHOSTAI_DATA_DIR}/policies:/app-state/policy:ro
      - ${GHOSTAI_DATA_DIR}/workspaces/default:/workspaces/default
      - control:/run/ghostai
    depends_on:
      - sandbox
    restart: unless-stopped
volumes:
  control:
