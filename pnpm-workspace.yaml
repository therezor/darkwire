packages:
  - 'packages/*'
  - 'examples/*'
allowBuilds:
  # esbuild powers tsup and vitest; unrs-resolver powers eslint-plugin-import-x.
  # Both are build-time only and need their postinstall to fetch a native binary.
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - jsdom@30.0.0
